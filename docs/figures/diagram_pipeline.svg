<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 880" width="1300" height="880" role="img" aria-labelledby="t d" font-family="Segoe UI, Calibri, Arial, sans-serif"><title id="t">End-to-end processing pipeline</title><desc id="d">Sequential stages: upload, file validation, text extraction, preprocessing and skill identification; then three independent scoring paths in parallel; then combined score, ranking, result inspection and CSV export.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6475"/></marker></defs><rect width="1300" height="880" fill="#ffffff"/><text x="40" y="38" font-size="24" font-weight="700" fill="#1b2437" text-anchor="start">End-to-end processing pipeline</text><text x="40" y="62" font-size="14" font-weight="400" fill="#5b6475" text-anchor="start">Sequential stages go left to right; the three scoring paths run in parallel for each resume and merge only in the combined score.</text><text x="40" y="92" font-size="13" font-weight="600" fill="#5b6475" text-anchor="start">Sequential stages</text><g><rect x="40" y="104" width="270" height="86" rx="10" fill="#eef1f6" stroke="#8b94a5" stroke-width="2"/><text x="175.0" y="131.5" font-size="15" font-weight="600" fill="#1b2437" text-anchor="middle">1  Upload</text><text x="175.0" y="152.5" font-size="13" font-weight="400" fill="#5b6475" text-anchor="middle">job description +</text><text x="175.0" y="172.5" font-size="13" font-weight="400" fill="#5b6475" text-anchor="middle">PDF resumes</text></g><path d="M310,147 L340,147" fill="none" stroke="#5b6475" stroke-width="2" marker-end="url(#arr)"/><g><rect x="340" y="104" width="270" height="86" rx="10" fill="#eef1f6" stroke="#8b94a5" stroke-width="2"/><text x="475.0" y="131.5" font-size="15" font-weight="600" fill="#1b2437" text-anchor="middle">2  File validation</text><text x="475.0" y="152.5" font-size="13" font-weight="400" fill="#5b6475" text-anchor="middle">status per file;</text><text x="475.0" y="172.5" font-size="13" font-weight="400" fill="#5b6475" text-anchor="middle">bad files listed, not ranked</text></g><path d="M610,147 L640,147" fill="none" stroke="#5b6475" stroke-width="2" marker-end="url(#arr)"/><g><rect x="640" y="104" width="270" height="86" rx="10" fill="#eef1f6" stroke="#8b94a5" stroke-width="2"/><text x="775.0" y="131.5" font-size="15" font-weight="600" fill="#1b2437" text-anchor="middle">3  Text extraction</text><text x="775.0" y="152.5" font-size="13" font-weight="400" fill="#5b6475" text-anchor="middle">PyMuPDF blocks in</text><text x="775.0" y="172.5" font-size="13" font-weight="400" fill="#5b6475" text-anchor="middle">reading order</text></g><path d="M910,147 L940,147" fill="none" stroke="#5b6475" stroke-width="2" marker-end="url(#arr)"/><g><rect x="940" y="104" width="270" height="86" rx="10" fill="#eef1f6" stroke="#8b94a5" stroke-width="2"/><text x="1075.0" y="131.5" font-size="15" font-weight="600" fill="#1b2437" text-anchor="middle">4  Preprocess + skills</text><text x="1075.0" y="152.5" font-size="13" font-weight="400" fill="#5b6475" text-anchor="middle">3 text views;</text><text x="1075.0" y="172.5" font-size="13" font-weight="400" fill="#5b6475" text-anchor="middle">required / preferred skills</text></g><path d="M1105,190 L1105,224 L245,224" fill="none" stroke="#8b94a5" stroke-width="2"/><rect x="40" y="244" width="1220" height="214" rx="14" fill="#f7f8fb" stroke="#d9dde6" stroke-width="1.5"/><text x="270" y="268" font-size="13" font-weight="600" fill="#5b6475" text-anchor="start">Independent scoring paths, in parallel</text><g><rect x="70" y="296" width="350" height="140" rx="10" fill="#e3eefb" stroke="#2a78d6" stroke-width="2"/><text x="245.0" y="340.5" font-size="15" font-weight="600" fill="#1b2437" text-anchor="middle">Lane A: TF-IDF</text><text x="245.0" y="361.5" font-size="13" font-weight="400" fill="#5b6475" text-anchor="middle">tokens -> TF-IDF vectors</text><text x="245.0" y="381.5" font-size="13" font-weight="400" fill="#5b6475" text-anchor="middle">(IDF fitted per resume / job pair)</text><text x="245.0" y="401.5" font-size="13" font-weight="400" fill="#5b6475" text-anchor="middle">cosine -> T</text><rect x="82" y="284" width="74.0" height="22" rx="11" fill="#2a78d6"/><text x="119.0" y="299.5" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">METHOD A</text></g><g><rect x="475" y="296" width="350" height="140" rx="10" fill="#ebe8fa" stroke="#6250d6" stroke-width="2" stroke-dasharray="7 5"/><text x="650.0" y="340.5" font-size="15" font-weight="600" fill="#1b2437" text-anchor="middle">Lane K: skill coverage</text><text x="650.0" y="361.5" font-size="13" font-weight="400" fill="#5b6475" text-anchor="middle">dictionary match of required skills</text><text x="650.0" y="381.5" font-size="13" font-weight="400" fill="#5b6475" text-anchor="middle">K = matched / required</text><text x="650.0" y="401.5" font-size="13" font-weight="400" fill="#5b6475" text-anchor="middle">(unique canonical skills)</text><rect x="487" y="284" width="165.0" height="22" rx="11" fill="#6250d6"/><text x="569.5" y="299.5" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">COMPONENT, NOT A MODE</text></g><g><rect x="880" y="296" width="350" height="140" rx="10" fill="#fdebe3" stroke="#eb6834" stroke-width="2"/><text x="1055.0" y="340.5" font-size="15" font-weight="600" fill="#1b2437" text-anchor="middle">Lane B: semantic</text><text x="1055.0" y="361.5" font-size="13" font-weight="400" fill="#5b6475" text-anchor="middle">chunks (&lt;= 200 tokens) -> embeddings</text><text x="1055.0" y="381.5" font-size="13" font-weight="400" fill="#5b6475" text-anchor="middle">best-matching chunk per job part</text><text x="1055.0" y="401.5" font-size="13" font-weight="400" fill="#5b6475" text-anchor="middle">cosine -> S (raw)</text><rect x="892" y="284" width="74.0" height="22" rx="11" fill="#eb6834"/><text x="929.0" y="299.5" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">METHOD B</text></g><path d="M245,224 L245,296" fill="none" stroke="#5b6475" stroke-width="2" marker-end="url(#arr)"/><path d="M790,224 L790,296" fill="none" stroke="#5b6475" stroke-width="2" marker-end="url(#arr)"/><path d="M1055,224 L1055,296" fill="none" stroke="#5b6475" stroke-width="2" marker-end="url(#arr)"/><g><rect x="380" y="520" width="540" height="74" rx="10" fill="#dff5ec" stroke="#1baf7a" stroke-width="2"/><text x="650.0" y="551.5" font-size="15" font-weight="600" fill="#1b2437" text-anchor="middle">5  Combined score (method C, default)</text><text x="650.0" y="572.5" font-size="13" font-weight="400" fill="#5b6475" text-anchor="middle">index = 0.50 x max(0, S) + 0.20 x T + 0.30 x K</text></g><path d="M245,436 L245,490 L470,490 L470,520" fill="none" stroke="#2a78d6" stroke-width="2" marker-end="url(#arr)"/><path d="M650,436 L650,520" fill="none" stroke="#6250d6" stroke-width="2" marker-end="url(#arr)"/><path d="M1055,436 L1055,490 L830,490 L830,520" fill="none" stroke="#eb6834" stroke-width="2" marker-end="url(#arr)"/><g><rect x="455" y="650" width="390" height="80" rx="10" fill="#eef1f6" stroke="#8b94a5" stroke-width="2"/><text x="650.0" y="674.5" font-size="15" font-weight="600" fill="#1b2437" text-anchor="middle">6  Ranking</text><text x="650.0" y="695.5" font-size="13" font-weight="400" fill="#5b6475" text-anchor="middle">best first; equal scores share a rank;</text><text x="650.0" y="715.5" font-size="13" font-weight="400" fill="#5b6475" text-anchor="middle">blank resumes last</text></g><path d="M650,594 L650,650" fill="none" stroke="#1baf7a" stroke-width="2" marker-end="url(#arr)"/><path d="M70,366 L46,366 L46,690 L455,690" fill="none" stroke="#2a78d6" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arr)"/><text x="54" y="682" font-size="12" font-weight="400" fill="#2a78d6" text-anchor="start">method A alone: ranked by T</text><path d="M1230,366 L1254,366 L1254,690 L845,690" fill="none" stroke="#eb6834" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arr)"/><text x="1246" y="682" font-size="12" font-weight="400" fill="#eb6834" text-anchor="end">method B alone: ranked by S</text><g><rect x="250" y="770" width="380" height="80" rx="10" fill="#eef1f6" stroke="#8b94a5" stroke-width="2"/><text x="440.0" y="794.5" font-size="15" font-weight="600" fill="#1b2437" text-anchor="middle">7  Result inspection</text><text x="440.0" y="815.5" font-size="13" font-weight="400" fill="#5b6475" text-anchor="middle">table, matched / missing skills,</text><text x="440.0" y="835.5" font-size="13" font-weight="400" fill="#5b6475" text-anchor="middle">evidence passages, warnings</text></g><g><rect x="690" y="770" width="360" height="80" rx="10" fill="#eef1f6" stroke="#8b94a5" stroke-width="2"/><text x="870.0" y="794.5" font-size="15" font-weight="600" fill="#1b2437" text-anchor="middle">8  CSV export</text><text x="870.0" y="815.5" font-size="13" font-weight="400" fill="#5b6475" text-anchor="middle">only the columns the method</text><text x="870.0" y="835.5" font-size="13" font-weight="400" fill="#5b6475" text-anchor="middle">calculated; blanks stay blank</text></g><path d="M650,730 L650,750 L440,750 L440,770" fill="none" stroke="#5b6475" stroke-width="2" marker-end="url(#arr)"/><path d="M630,810 L690,810" fill="none" stroke="#5b6475" stroke-width="2" marker-end="url(#arr)"/><text x="40" y="866" font-size="13" font-weight="400" fill="#5b6475" text-anchor="start">Dashed arrows: choosing method A or B in the sidebar ranks by that score only. Skill coverage cannot be chosen on its own.</text></svg>