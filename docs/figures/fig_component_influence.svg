<title id="t">Which term drives the combined index? (share of its variance, 46 synthetic judgments)</title><desc id="d">Horizontal bars of each weighted term's share of the variance of the combined matching index: skill coverage about 0.75, semantic about 0.20, TF-IDF about 0.05.</desc><rect width="780" height="342" fill="var(--surface)"/><text x="24" y="32" font-size="18" font-weight="600">Which term drives the combined index? (share of its variance, 46 synthetic judgments)</text><text x="24" y="54" font-size="12.5" class="t2">The terms are added without rescaling, so the widest-spread term controls the ordering.</text><line class="axis" x1="250.0" y1="86" x2="250.0" y2="230"/><text x="250.0" y="248" font-size="11" text-anchor="middle" class="t2">0.00</text><line class="grid" x1="340.0" y1="86" x2="340.0" y2="230"/><text x="340.0" y="248" font-size="11" text-anchor="middle" class="t2">0.25</text><line class="grid" x1="430.0" y1="86" x2="430.0" y2="230"/><text x="430.0" y="248" font-size="11" text-anchor="middle" class="t2">0.50</text><line class="grid" x1="520.0" y1="86" x2="520.0" y2="230"/><text x="520.0" y="248" font-size="11" text-anchor="middle" class="t2">0.75</text><line class="grid" x1="610.0" y1="86" x2="610.0" y2="230"/><text x="610.0" y="248" font-size="11" text-anchor="middle" class="t2">1.00</text><text x="240" y="111.0" font-size="13" text-anchor="end">Skill coverage (weight 0.30)</text><path d="M250,92 L514.6,92 A4,4 0 0 1 518.6,96 L518.6,118 A4,4 0 0 1 514.6,122 L250,122 Z" fill="var(--neutral)"><title>Skill coverage (weight 0.30): 0.746 (std. dev. of the raw score 0.346)</title></path><text x="526.6" y="111.0" font-size="12.5">0.746</text><text x="570.6" y="111.0" font-size="11.5" class="t2">std. dev. of the raw score 0.346</text><text x="240" y="163.0" font-size="13" text-anchor="end">Semantic similarity (weight 0.50)</text><path d="M250,144 L318.5,144 A4,4 0 0 1 322.5,148 L322.5,170 A4,4 0 0 1 318.5,174 L250,174 Z" fill="var(--neutral)"><title>Semantic similarity (weight 0.50): 0.201 (std. dev. of the raw score 0.089)</title></path><text x="330.5" y="163.0" font-size="12.5">0.201</text><text x="374.5" y="163.0" font-size="11.5" class="t2">std. dev. of the raw score 0.089</text><text x="240" y="215.0" font-size="13" text-anchor="end">TF-IDF similarity (weight 0.20)</text><path d="M250,196 L264.9,196 A4,4 0 0 1 268.9,200 L268.9,222 A4,4 0 0 1 264.9,226 L250,226 Z" fill="var(--neutral)"><title>TF-IDF similarity (weight 0.20): 0.053 (std. dev. of the raw score 0.051)</title></path><text x="276.9" y="215.0" font-size="12.5">0.053</text><text x="320.9" y="215.0" font-size="11.5" class="t2">std. dev. of the raw score 0.051</text><text x="24" y="316" font-size="11.5" class="t2">Source: artifacts/evaluation_scores.csv (46 SYNTHETIC judgments).</text><text x="24" y="332" font-size="11.5" class="t2">Descriptive statistic of one small set; not a reason to change a weight.</text></svg>