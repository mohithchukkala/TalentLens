<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 840" width="1280" height="840" role="img" aria-labelledby="t d" font-family="Segoe UI, Calibri, Arial, sans-serif"><title id="t">System architecture</title><desc id="d">Streamlit interface with job description, PDF upload and a method selector; PDF parsing and validation; preprocessing; skill coverage, TF-IDF similarity and semantic similarity computed independently; combined index; ranking table and CSV export.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6475"/></marker></defs><rect width="1280" height="840" fill="#ffffff"/><text x="40" y="38" font-size="24" font-weight="700" fill="#1b2437" text-anchor="start">System architecture</text><text x="40" y="62" font-size="14" font-weight="400" fill="#5b6475" text-anchor="start">All processing is local and in memory. Three selectable methods: A TF-IDF, B semantic, C combined (default).</text><rect x="30" y="80" width="1220" height="112" rx="14" fill="#f7f8fb" stroke="#d9dde6" stroke-width="1.5"/><text x="46" y="104" font-size="13" font-weight="600" fill="#5b6475" text-anchor="start">Streamlit interface (app.py): inputs</text><g><rect x="60" y="108" width="270" height="66" rx="10" fill="#eef1f6" stroke="#8b94a5" stroke-width="2"/><text x="195.0" y="135.5" font-size="15" font-weight="600" fill="#1b2437" text-anchor="middle">Job description</text><text x="195.0" y="156.5" font-size="13" font-weight="400" fill="#5b6475" text-anchor="middle">pasted text</text></g><g><rect x="360" y="108" width="270" height="66" rx="10" fill="#eef1f6" stroke="#8b94a5" stroke-width="2"/><text x="495.0" y="135.5" font-size="15" font-weight="600" fill="#1b2437" text-anchor="middle">PDF resumes</text><text x="495.0" y="156.5" font-size="13" font-weight="400" fill="#5b6475" text-anchor="middle">one or many files, in memory</text></g><g><rect x="660" y="108" width="560" height="66" rx="10" fill="#fff6dd" stroke="#d9a400" stroke-width="2"/><text x="940.0" y="125.5" font-size="15" font-weight="600" fill="#1b2437" text-anchor="middle">Method selector (sidebar)</text><text x="940.0" y="146.5" font-size="13" font-weight="400" fill="#5b6475" text-anchor="middle">A TF-IDF  |  B Semantic  |  C Combined (default):</text><text x="940.0" y="166.5" font-size="13" font-weight="400" fill="#5b6475" text-anchor="middle">decides which score is ranked</text></g><rect x="30" y="208" width="1220" height="118" rx="14" fill="#f7f8fb" stroke="#d9dde6" stroke-width="1.5"/><text x="520" y="232" font-size="13" font-weight="600" fill="#5b6475" text-anchor="start">Input validation and PDF extraction (pdf_parser.py, app_logic.py)</text><g><rect x="60" y="238" width="400" height="70" rx="10" fill="#eef1f6" stroke="#8b94a5" stroke-width="2"/><text x="260.0" y="257.5" font-size="15" font-weight="600" fill="#1b2437" text-anchor="middle">Input validation</text><text x="260.0" y="278.5" font-size="13" font-weight="400" fill="#5b6475" text-anchor="middle">empty job description, no upload,</text><text x="260.0" y="298.5" font-size="13" font-weight="400" fill="#5b6475" text-anchor="middle">TF-IDF job description with only stop words</text></g><g><rect x="490" y="238" width="730" height="70" rx="10" fill="#eef1f6" stroke="#8b94a5" stroke-width="2"/><text x="855.0" y="257.5" font-size="15" font-weight="600" fill="#1b2437" text-anchor="middle">PDF text extraction (PyMuPDF), one status per file</text><text x="855.0" y="278.5" font-size="13" font-weight="400" fill="#5b6475" text-anchor="middle">readable | no usable text | probably scanned (OCR needed) | password-protected |</text><text x="855.0" y="298.5" font-size="13" font-weight="400" fill="#5b6475" text-anchor="middle">corrupted | empty | too large | duplicate: listed with a reason, not ranked</text></g><path d="M195,174 L195,238" fill="none" stroke="#5b6475" stroke-width="2" marker-end="url(#arr)"/><path d="M495,174 L495,238" fill="none" stroke="#5b6475" stroke-width="2" marker-end="url(#arr)"/><g><rect x="60" y="350" width="1160" height="54" rx="10" fill="#eef1f6" stroke="#8b94a5" stroke-width="2"/><text x="640.0" y="371.5" font-size="15" font-weight="600" fill="#1b2437" text-anchor="middle">Preprocessing (preprocessing.py): three views of the text</text><text x="640.0" y="392.5" font-size="13" font-weight="400" fill="#5b6475" text-anchor="middle">skills view: case and punctuation kept   |   TF-IDF view: lowercase tokens (c++, node.js, ci/cd)   |   embedding view: near-original text, contact details removed</text></g><path d="M855,308 L855,350" fill="none" stroke="#5b6475" stroke-width="2" marker-end="url(#arr)"/><rect x="30" y="424" width="1220" height="188" rx="14" fill="#f7f8fb" stroke="#d9dde6" stroke-width="1.5"/><text x="270" y="448" font-size="13" font-weight="600" fill="#5b6475" text-anchor="start">Independent scoring paths, in parallel</text><g><rect x="60" y="486" width="350" height="112" rx="10" fill="#e3eefb" stroke="#2a78d6" stroke-width="2"/><text x="235.0" y="526.5" font-size="15" font-weight="600" fill="#1b2437" text-anchor="middle">TF-IDF similarity T</text><text x="235.0" y="547.5" font-size="13" font-weight="400" fill="#5b6475" text-anchor="middle">TF-IDF vectors, IDF fitted per</text><text x="235.0" y="567.5" font-size="13" font-weight="400" fill="#5b6475" text-anchor="middle">job-description / resume pair, cosine</text><rect x="72" y="474" width="74.0" height="22" rx="11" fill="#2a78d6"/><text x="109.0" y="489.5" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">METHOD A</text></g><g><rect x="465" y="486" width="350" height="112" rx="10" fill="#ebe8fa" stroke="#6250d6" stroke-width="2" stroke-dasharray="7 5"/><text x="640.0" y="526.5" font-size="15" font-weight="600" fill="#1b2437" text-anchor="middle">Skill coverage K</text><text x="640.0" y="547.5" font-size="13" font-weight="400" fill="#5b6475" text-anchor="middle">dictionary of 114 skills, aliases, rules</text><text x="640.0" y="567.5" font-size="13" font-weight="400" fill="#5b6475" text-anchor="middle">required skills found / required skills</text><rect x="477" y="474" width="228.0" height="22" rx="11" fill="#6250d6"/><text x="591.0" y="489.5" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">COMPONENT ONLY, NOT SELECTABLE</text></g><g><rect x="870" y="486" width="350" height="112" rx="10" fill="#fdebe3" stroke="#eb6834" stroke-width="2"/><text x="1045.0" y="526.5" font-size="15" font-weight="600" fill="#1b2437" text-anchor="middle">Semantic similarity S</text><text x="1045.0" y="547.5" font-size="13" font-weight="400" fill="#5b6475" text-anchor="middle">all-MiniLM-L6-v2 embeddings, chunks of</text><text x="1045.0" y="567.5" font-size="13" font-weight="400" fill="#5b6475" text-anchor="middle">up to 200 tokens, cosine (raw)</text><rect x="882" y="474" width="74.0" height="22" rx="11" fill="#eb6834"/><text x="919.0" y="489.5" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">METHOD B</text></g><path d="M235,404 L235,486" fill="none" stroke="#5b6475" stroke-width="2" marker-end="url(#arr)"/><path d="M760,404 L760,486" fill="none" stroke="#5b6475" stroke-width="2" marker-end="url(#arr)"/><path d="M1045,404 L1045,486" fill="none" stroke="#5b6475" stroke-width="2" marker-end="url(#arr)"/><g><rect x="260" y="656" width="760" height="60" rx="10" fill="#dff5ec" stroke="#1baf7a" stroke-width="2"/><text x="640.0" y="680.5" font-size="15" font-weight="600" fill="#1b2437" text-anchor="middle">Combined matching index (ranker.py)</text><text x="640.0" y="701.5" font-size="13" font-weight="400" fill="#5b6475" text-anchor="middle">0.50 x max(0, S) + 0.20 x T + 0.30 x K     (weights fixed in advance, not tuned)</text><rect x="272" y="644" width="144.0" height="22" rx="11" fill="#1baf7a"/><text x="344.0" y="659.5" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">METHOD C (DEFAULT)</text></g><path d="M235,598 L235,630 L440,630 L440,656" fill="none" stroke="#2a78d6" stroke-width="2" marker-end="url(#arr)"/><path d="M640,598 L640,656" fill="none" stroke="#6250d6" stroke-width="2" marker-end="url(#arr)"/><path d="M1045,598 L1045,630 L840,630 L840,656" fill="none" stroke="#eb6834" stroke-width="2" marker-end="url(#arr)"/><g><rect x="60" y="752" width="1160" height="56" rx="10" fill="#eef1f6" stroke="#8b94a5" stroke-width="2"/><text x="640.0" y="774.5" font-size="15" font-weight="600" fill="#1b2437" text-anchor="middle">Ranking and outputs (app_logic.py, app.py)</text><text x="640.0" y="795.5" font-size="13" font-weight="400" fill="#5b6475" text-anchor="middle">ranked table  |  per-candidate details (matched / missing skills, evidence, warnings)  |  files not ranked  |  CSV export</text></g><path d="M640,716 L640,752" fill="none" stroke="#1baf7a" stroke-width="2" marker-end="url(#arr)"/><path d="M60,542 L44,542 L44,734 L100,734 L100,752" fill="none" stroke="#2a78d6" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arr)"/><text x="52" y="726" font-size="12" font-weight="400" fill="#2a78d6" text-anchor="start">A alone: ranked by T</text><path d="M1220,542 L1236,542 L1236,734 L1180,734 L1180,752" fill="none" stroke="#eb6834" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arr)"/><text x="1228" y="726" font-size="12" font-weight="400" fill="#eb6834" text-anchor="end">B alone: ranked by S</text><path d="M1220,141 L1264,141 L1264,780 L1220,780" fill="none" stroke="#d9a400" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arr)"/></svg>